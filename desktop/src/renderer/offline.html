<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurtistic — Modo Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d12;
      color: #f4f4f8;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card {
      max-width: 440px;
      padding: 28px;
      border-radius: 18px;
      background: #171720;
      border: 1px solid #2b2b3a;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 1.2rem; margin: 0 0 8px; }
    p { font-size: 0.9rem; color: #a8a8bd; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #8b5cf6;
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sem conexão com a internet</h1>
    <p>
      O Aurtistic não conseguiu conectar agora. Seus alarmes de autocuidado na bandeja e a fila
      local continuam preservados e serão retomados assim que a rede voltar.
    </p>
    <button onclick="window.location.href='https://aurtistic.vercel.app'">Tentar novamente</button>
  </div>
</body>
</html>
